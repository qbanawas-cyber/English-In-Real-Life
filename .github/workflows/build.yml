name: Build Android APK From ZIP

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip
      run: sudo apt-get install -y unzip

    - name: Extract Project ZIP
      run: |
        ZIP_FILE=$(ls | grep -i "EnglishInRealLife.*\.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: ZIP file not found!"
          exit 1
        fi
        echo "Extracting $ZIP_FILE..."
        unzip "$ZIP_FILE" -d extracted_project
        
        if [ -d "extracted_project/EnglishInRealLife" ]; then
          mv extracted_project/EnglishInRealLife/* .
        else
          mv extracted_project/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          cd $(dirname "$GRADLEW_PATH")
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug
        fi

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnglishInRealLife-App
        path: "**/build/outputs/apk/debug/*-debug.apk"
